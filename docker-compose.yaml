version: "3.8"

services:

  postgres:
    image: "postgres:latest"
    container_name: ms_categories
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ms_categories_postgres:/var/lib/postgresql/data

volumes:
  ms_categories_postgres: